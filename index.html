<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>O'Sole Baby · ¡Hazte una foto!</title>
<style>
  :root { --bg:#fdf1f7; --ink:#0b3d91; --pink:#e6197d; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
         padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom); }
  h1 { font-size:1.05rem; margin:0; text-align:center; }
  #stage { position:relative; height:min(60dvh, 120vw); aspect-ratio:2/3; border-radius:14px; overflow:hidden;
           background:#fff; box-shadow:0 6px 24px rgba(11,61,145,.18); touch-action:pan-y; }
  #cam { position:absolute; left:0; top:0; width:100%; height:100%; }
  #cam.mirror { transform:scaleX(-1); }
  #frameImg, #result { position:absolute; inset:0; width:100%; height:100%; }
  #frameImg { pointer-events:none; }
  #result { display:none; }
  .arrow { position:absolute; top:50%; transform:translateY(-50%); width:40px; height:40px; padding:0;
           border-radius:50%; background:rgba(255,255,255,.85); color:var(--ink); font-size:24px; line-height:1;
           box-shadow:0 2px 8px rgba(0,0,0,.2); }
  #prev { left:6px; } #next { right:6px; }
  #thumbs { display:flex; gap:10px; justify-content:center; }
  .thumb { width:62px; padding:0; border:3px solid transparent; border-radius:12px; background:#fff; overflow:hidden;
           display:flex; flex-direction:column; align-items:center; font-size:.7rem; font-weight:700; color:var(--ink); }
  .thumb img { width:100%; aspect-ratio:2/3; object-fit:cover; display:block; }
  .thumb span { padding:2px 0; }
  .thumb.active { border-color:var(--pink); }
  .row { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  button { font:inherit; font-weight:700; border:0; border-radius:999px; padding:12px 24px;
           background:var(--pink); color:#fff; cursor:pointer; }
  button.ig { background:linear-gradient(45deg,#f9a825,#e6197d,#7b2ff7); }
  button.sec { background:transparent; color:var(--ink); border:2px solid var(--ink); }
  #msg { font-size:.9rem; text-align:center; max-width:360px; min-height:1.2em; margin:0; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
  <h1>¡Elige tu personaje y hazte una foto!</h1>

  <div id="stage">
    <video id="cam" autoplay playsinline muted></video>
    <img id="frameImg" alt="">
    <img id="result" alt="Tu foto">
    <button class="arrow" id="prev" aria-label="Marco anterior">‹</button>
    <button class="arrow" id="next" aria-label="Marco siguiente">›</button>
  </div>

  <div id="thumbs"></div>

  <p id="msg">Pulsa «Activar cámara» y acepta el permiso.</p>

  <div class="row" id="live">
    <button id="start">Activar cámara</button>
    <button id="shoot" hidden>Tomar foto</button>
    <button id="flip" class="sec" hidden>Girar cámara</button>
  </div>
  <div class="row" id="done" hidden>
    <button id="download">Descargar foto</button>
    <button id="share" class="ig">Compartir en Instagram</button>
    <button id="retry" class="sec">Repetir</button>
  </div>

const $ = id => document.getElementById(id);
const cam = $("cam"), frameImg = $("frameImg"), result = $("result"), msg = $("msg"), stage = $("stage");
let stream = null, facing = "user", blob = null, idx = 0, finished = false;

FRAMES.forEach(f => { f.img = new Image(); f.img.src = f.src; });

/* ---------- Carrusel ---------- */
const thumbs = $("thumbs");
FRAMES.forEach((f, i) => {
  const b = document.createElement("button");
  b.className = "thumb"; b.setAttribute("aria-label", f.name);
  b.innerHTML = '<img alt=""><span>' + f.name + '</span>';
  b.querySelector("img").src = f.src;
  b.onclick = () => select(i);
  thumbs.appendChild(b);
});
function select(i) {
  idx = (i + FRAMES.length) % FRAMES.length;
  frameImg.src = FRAMES[idx].src;
  [...thumbs.children].forEach((t, k) => t.classList.toggle("active", k === idx));
  layout();
}
$("prev").onclick = () => select(idx - 1);
$("next").onclick = () => select(idx + 1);
let sx = null;
stage.addEventListener("touchstart", e => { sx = e.touches[0].clientX; }, { passive: true });
stage.addEventListener("touchend", e => {
  if (sx === null || finished) return;
  const dx = e.changedTouches[0].clientX - sx; sx = null;
  if (Math.abs(dx) > 50) select(idx + (dx < 0 ? 1 : -1));
}, { passive: true });

/* ---------- Cámara centrada en el círculo del marco elegido ---------- */
function fit() {
  const f = FRAMES[idx], vw = cam.videoWidth, vh = cam.videoHeight;
  const s = f.d / (ZOOM * Math.min(vw, vh));
  return { dw: vw * s, dh: vh * s, f };
}
function layout() {
  if (!cam.videoWidth) return;
  const { dw, dh, f } = fit();
  cam.style.width = (dw / W * 100) + "%";
  cam.style.height = (dh / H * 100) + "%";
  cam.style.left = ((f.hx - dw / 2) / W * 100) + "%";
  cam.style.top = ((f.hy - dh / 2) / H * 100) + "%";
}
cam.addEventListener("loadedmetadata", layout);
cam.addEventListener("resize", layout);

async function startCam() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    msg.textContent = "Abre este enlace en Chrome o Safari para usar la cámara.";
    return;
  }
  if (stream) stream.getTracks().forEach(t => t.stop());
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: facing, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
  } catch (e) {
    try { stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false }); }
    catch (e2) {
      msg.textContent = (e2.name === "NotAllowedError" || e.name === "NotAllowedError")
        ? "La cámara está bloqueada. Toca el candado junto al enlace → Permisos → Cámara → Permitir, y vuelve a pulsar «Activar cámara»."
        : "No se pudo abrir la cámara. Cierra otras apps que la usen y pulsa «Activar cámara».";
      return;
    }
  }
  cam.srcObject = stream;
  cam.classList.toggle("mirror", facing === "user");
  $("start").hidden = true; $("shoot").hidden = false; $("flip").hidden = false;
  msg.textContent = "Coloca tu cara dentro del círculo y pulsa «Tomar foto».";
}

/* ---------- Foto ---------- */
function shoot() {
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const g = c.getContext("2d");
  g.fillStyle = "#fff"; g.fillRect(0, 0, W, H);
  const { dw, dh, f } = fit();
  const mirror = facing === "user";
  g.save();
  if (mirror) { g.translate(W, 0); g.scale(-1, 1); }
  g.drawImage(cam, (mirror ? W - f.hx : f.hx) - dw / 2, f.hy - dh / 2, dw, dh);
  g.restore();
  g.drawImage(f.img, 0, 0, W, H);
  c.toBlob(b => {
    blob = b; finished = true;
    result.src = URL.createObjectURL(b);
    result.style.display = "block";
    $("prev").hidden = $("next").hidden = thumbs.hidden = true;
    $("live").hidden = true; $("done").hidden = false;
    msg.textContent = "¿Te gusta? Descárgala o compártela.";
    stream.getTracks().forEach(t => t.stop());
  }, "image/jpeg", 0.93);
}

function filename() { return "osole-baby-" + FRAMES[idx].id + ".jpg"; }

function download() {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = filename();
  document.body.appendChild(a); a.click(); a.remove();
  msg.textContent = "¡Foto descargada! Si no la ves, mantén presionada la imagen y elige «Guardar imagen».";
}

async function shareIG() {
  try { await navigator.clipboard.writeText(HASHTAG); } catch (e) {}
  const file = new File([blob], filename(), { type: "image/jpeg" });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file], text: HASHTAG });
      msg.textContent = "Elige Instagram y pega " + HASHTAG + " (ya está copiado).";
      return;
    } catch (e) { if (e.name === "AbortError") return; }
  }
  download();
  msg.textContent = "Foto descargada. Súbela a Instagram y pega " + HASHTAG + " (ya está copiado).";
}

function retry() {
  finished = false;
  result.style.display = "none";
  $("prev").hidden = $("next").hidden = thumbs.hidden = false;
  $("done").hidden = true; $("live").hidden = false;
  startCam();
}

$("start").onclick = startCam;
$("shoot").onclick = shoot;
$("flip").onclick = () => { facing = facing === "user" ? "environment" : "user"; startCam(); };
$("download").onclick = download;
$("share").onclick = shareIG;
$("retry").onclick = retry;
select(0);
</script>
