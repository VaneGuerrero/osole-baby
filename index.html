<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>O'Sole Baby · ¡Hazte una foto!</title>
<style>
  :root { --bg:#fdf1f7; --ink:#0b3d91; --pink:#e6197d; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px;
         padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom); }
  h1 { font-size:1.1rem; margin:0; text-align:center; }
  #stage { position:relative; height:min(68dvh, 130vw); aspect-ratio:2/3; border-radius:14px; overflow:hidden;
           background:#fff; box-shadow:0 6px 24px rgba(11,61,145,.18); }
  #view, #result { position:absolute; inset:0; width:100%; height:100%; }
  #result { display:none; }
  #src { position:absolute; width:1px; height:1px; opacity:0; pointer-events:none; }
  .row { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  button { font:inherit; font-weight:700; border:0; border-radius:999px; padding:12px 24px;
           background:var(--pink); color:#fff; cursor:pointer; }
  button.sec { background:transparent; color:var(--ink); border:2px solid var(--ink); }
  button:focus-visible { outline:3px solid var(--ink); outline-offset:2px; }
  #msg { font-size:.9rem; text-align:center; max-width:360px; min-height:1.2em; margin:0; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
  <h1>¡Hazte una foto con el león!</h1>

  <div id="stage">
    <canvas id="view" width="1024" height="1536"></canvas>
    <img id="result" alt="Tu foto">
  </div>
  <video id="src" autoplay playsinline muted></video>

  <p id="msg">Pulsa «Activar cámara» y acepta el permiso.</p>

  <div class="row" id="live">
    <button id="start">Activar cámara</button>
    <button id="shoot" hidden>Tomar foto</button>
    <button id="flip" class="sec" hidden>Girar cámara</button>
  </div>
  <div class="row" id="done" hidden>
    <button id="save">Descargar foto</button>
    <button id="retry" class="sec">Repetir</button>
  </div>

<script>
const W = 1024, H = 1536;     // tamaño del marco (marco.png)
const HX = 514, HY = 540;     // centro del círculo del rostro dentro del marco

const $ = id => document.getElementById(id);
const cam = $("src"), view = $("view"), ctx = view.getContext("2d"), result = $("result"), msg = $("msg");
let stream = null, facing = "user", live = false, blob = null;

const frame = new Image();
frame.src = "marco.png";

/* Dibuja cámara + marco. La cámara se centra en el círculo del rostro. */
function draw() {
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, H);
  const vw = cam.videoWidth, vh = cam.videoHeight;
  if (vw && vh) {
    const mirror = facing === "user";
    const cx = mirror ? W - HX : HX;
    const s = Math.max(2 * Math.max(HX, W - HX) / vw, 2 * Math.max(HY, H - HY) / vh);
    const dw = vw * s, dh = vh * s;
    ctx.save();
    if (mirror) { ctx.translate(W, 0); ctx.scale(-1, 1); }
    ctx.drawImage(cam, cx - dw / 2, HY - dh / 2, dw, dh);
    ctx.restore();
  }
  if (frame.complete && frame.naturalWidth) ctx.drawImage(frame, 0, 0, W, H);
}
(function loop() { if (live) draw(); requestAnimationFrame(loop); })();
frame.onload = draw;

async function startCam() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: facing, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
    cam.srcObject = stream;
    await cam.play();
    live = true;
    $("start").hidden = true; $("shoot").hidden = false; $("flip").hidden = false;
    msg.textContent = "Coloca tu cara dentro del círculo y pulsa «Tomar foto».";
  } catch (e) {
    msg.textContent = "No se pudo abrir la cámara. Permite el acceso a la cámara en tu navegador.";
  }
}

function shoot() {
  draw(); live = false;
  view.toBlob(b => {
    blob = b;
    result.src = URL.createObjectURL(b);
    result.style.display = "block";
    $("live").hidden = true; $("done").hidden = false;
    msg.textContent = "¿Te gusta? Descárgala o repite.";
    stream.getTracks().forEach(t => t.stop());
  }, "image/jpeg", 0.93);
}

async function save() {
  const file = new File([blob], "osole-baby-foto.jpg", { type: "image/jpeg" });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return; }
    catch (e) { if (e.name === "AbortError") return; }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "osole-baby-foto.jpg";
  document.body.appendChild(a); a.click(); a.remove();
  msg.textContent = "Si no se descargó, mantén presionada la foto y elige «Guardar imagen».";
}

function retry() {
  result.style.display = "none";
  $("done").hidden = true; $("live").hidden = false;
  startCam();
}

$("start").onclick = startCam;
$("shoot").onclick = shoot;
$("flip").onclick = () => { facing = facing === "user" ? "environment" : "user"; startCam(); };
$("save").onclick = save;
$("retry").onclick = retry;
</script>
</body>
</html>
